[package]
name = "collab-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }

# CRDT
yrs = { version = "0.26", features = ["sync"] }

# Password hashing
argon2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# HTTP middleware / utilities
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Random token generation
rand = "0.9"

# Concurrent hash map for room store
dashmap = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Futures utilities
futures = "0.3"

# API documentation (OpenAPI / Swagger)
utoipa = { version = "5", features = ["axum_extras", "chrono", "preserve_path_order"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
